<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d0000"/>
      <stop offset="60%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#5c1a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tiles" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="40" fill="none" stroke="#D4AF37" stroke-opacity="0.07" stroke-width="0.5"/>
      <circle cx="20" cy="20" r="1" fill="#D4AF37" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#tiles)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Arch frame decoration -->
  <ellipse cx="400" cy="520" rx="340" ry="380" fill="none" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="1"/>
  <ellipse cx="400" cy="520" rx="290" ry="330" fill="none" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="0.5"/>
  <!-- Fork & knife icon (centered) -->
  <g transform="translate(330,140)" fill="#D4AF37" fill-opacity="0.5">
    <rect x="14" y="0" width="3" height="50" rx="1.5"/>
    <path d="M10 0 Q8 12 9 18 Q10 22 14 24 L14 50 L17 50 L17 24 Q21 22 22 18 Q23 12 21 0 Z"/>
    <rect x="60" y="0" width="3" height="18" rx="1.5"/>
    <path d="M58 0 Q56 8 57 14 Q58 18 61.5 20 L61.5 50 L64.5 50 L64.5 20 Q67 18 68 14 Q69 8 67 0 Z"/>
    <rect x="60" y="18" width="3" height="32" rx="1.5"/>
  </g>
  <!-- Restaurant name -->
  <text x="400" y="270" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#F5F0E6" text-anchor="middle" letter-spacing="2">BELLA ITALIA</text>
  <!-- Subtitle line -->
  <line x1="180" y1="290" x2="620" y2="290" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="400" y="318" font-family="Georgia, serif" font-size="16" fill="#D4AF37" fill-opacity="0.75" text-anchor="middle" letter-spacing="5" font-style="italic">Ristorante · Pizzeria</text>
  <!-- Bottom ornament -->
  <g transform="translate(340,348)" fill="#D4AF37" fill-opacity="0.35">
    <polygon points="60,0 66,12 80,12 69,20 73,33 60,25 47,33 51,20 40,12 54,12"/>
  </g>
</svg>