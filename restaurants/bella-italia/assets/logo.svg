<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a0000"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Wreath circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="0.5"/>
  <!-- BI monogram -->
  <text x="100" y="115" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#F5F0E6" text-anchor="middle">BI</text>
  <!-- Est. text -->
  <text x="100" y="138" font-family="Georgia, serif" font-size="9" fill="#D4AF37" fill-opacity="0.8" text-anchor="middle" letter-spacing="3">EST. 1985</text>
  <!-- Bottom star -->
  <g transform="translate(88,148)">
    <polygon points="12,0 14,8 22,8 16,12 18,20 12,16 6,20 8,12 2,8 10,8" fill="#D4AF37" fill-opacity="0.45" transform="scale(0.55)"/>
  </g>
</svg>