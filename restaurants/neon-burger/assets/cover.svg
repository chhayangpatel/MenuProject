<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#FF0055" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Neon glow blob -->
  <ellipse cx="400" cy="220" rx="220" ry="160" fill="url(#neonGlow)" filter="url(#blur)"/>
  <!-- Diagonal accent shapes -->
  <rect x="-20" y="180" width="180" height="60" fill="#FF0055" fill-opacity="0.18" transform="skewX(-20)"/>
  <rect x="640" y="180" width="220" height="60" fill="#FF0055" fill-opacity="0.12" transform="skewX(-20)"/>
  <!-- Main text -->
  <text x="400" y="215" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#FAFAFA" text-anchor="middle" letter-spacing="-2">NEON</text>
  <text x="400" y="295" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#FF0055" text-anchor="middle" letter-spacing="-2">BURGER</text>
  <!-- Tagline -->
  <text x="400" y="338" font-family="Arial, sans-serif" font-size="13" fill="#FAFAFA" fill-opacity="0.4" text-anchor="middle" letter-spacing="6" text-transform="uppercase">SMASH · SIZZLE · STREET</text>
  <!-- Corner accent -->
  <polygon points="0,0 80,0 0,80" fill="#FF0055" fill-opacity="0.25"/>
  <polygon points="800,450 720,450 800,370" fill="#FF0055" fill-opacity="0.15"/>
</svg>