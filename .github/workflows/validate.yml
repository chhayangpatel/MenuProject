name: Validate Restaurant Configs

on:
  pull_request:
    paths:
      - "restaurants/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate:configs
      - run: npm run check:contrast
