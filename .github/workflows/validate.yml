name: Validate Restaurant Configs

on:
  pull_request:
    paths:
      - "restaurants/**"
      - "src/**"
      - "scripts/**"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate configs (schema + assets + slugs + item IDs)
        run: npm run validate:configs
      - name: Check WCAG contrast on every restaurant palette
        run: npm run check:contrast
      - name: Build (catches template/schema errors at build time)
        run: npm run build